version: "2"

run:
  timeout: 5m

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - gocyclo # complexidade ciclomática
    - cyclop # complexidade ciclomática (também por pacote)
    - errorlint # uso correto de errors.Is / errors.As / %w
    - unparam
    - unconvert
    - revive # comentário de pacote
  settings:
    gocyclo:
      # reporta funções com complexidade > 10
      min-complexity: 10
    cyclop:
      max-complexity: 10
    revive:
      # Sem a regra exported: godoc só quando explica algo que o nome não diz.
      rules:
        - name: package-comments

formatters:
  enable:
    - gofmt
    - goimports
